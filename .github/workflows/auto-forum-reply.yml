name: Auto forum reply

on:
  schedule:
    # 每 12 小时检查一次（减少 Vercel API 调用）
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "强制执行（忽略配置检查）"
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: auto-forum-reply
  cancel-in-progress: true

jobs:
  check:
    name: Check and reply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Check config
        id: check
        run: |
          FORCE="${{ github.event.inputs.force || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SITE_URL" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CONFIG=$(curl -s "${SITE_URL}/api/schedule-config" 2>/dev/null || echo '{}')
          REPLY_ENABLED=$(echo "$CONFIG" | python3 -c "import sys,json; print(json.load(sys.stdin).get('replyEnabled', True))" 2>/dev/null || echo "True")
          if [ "$REPLY_ENABLED" = "False" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  reply:
    name: Reply to posts
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_BASE: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      AI_MODEL: gemini-3.6-flash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reply to forum posts
        run: node scripts/auto-forum-reply.mjs
