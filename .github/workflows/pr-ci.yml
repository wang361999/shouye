name: PR CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/ethhy?schema=public
          JWT_SECRET: ci-only-jwt-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
