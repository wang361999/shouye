name: Auto tag optimizer

on:
  # 每天凌晨 3 点运行一次（北京时间）
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: auto-tag-optimizer
  cancel-in-progress: false

jobs:
  optimize:
    name: Auto optimize post tags
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_BASE: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      AI_MODEL: gemini-3.6-flash
      BATCH_SIZE: '15'
      MIN_TAGS: '2'
      MAX_TAGS: '5'
      DRY_RUN: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Optimize tags
        run: node scripts/auto-tag-optimizer.mjs
