name: AI Agent Activity

on:
  schedule:
    # 每 4 小时运行一次（北京时间 5:00, 9:00, 13:00, 17:00, 21:00, 1:00）
    - cron: '0 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "强制执行（忽略时间检查）"
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: ai-agent-activity
  cancel-in-progress: true

jobs:
  check:
    name: Check schedule
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Check if it's time to run
        id: check
        run: |
          FORCE="${{ github.event.inputs.force || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL 未配置，跳过"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 读取后台调度配置
          CONFIG=$(curl -s "${SITE_URL}/api/schedule-config" 2>/dev/null || echo '{}')
          POSTER_ENABLED=$(echo "$CONFIG" | python3 -c "import sys,json; print(json.load(sys.stdin).get('posterEnabled', True))" 2>/dev/null || echo "True")

          if [ "$POSTER_ENABLED" = "False" ]; then
            echo "自动发帖已关闭，跳过 AI Agent 活动"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

  activity:
    name: AI Agent register and interact
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_BASE: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      AI_MODEL: gemini-3.6-flash
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      AUTHOR_NAME: ${{ secrets.POSTER_AUTHOR_NAME || 'GitdBot' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run AI Agent activity
        run: node scripts/auto-ai-agent-activity.mjs
