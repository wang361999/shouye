name: Auto forum poster

on:
  schedule:
    # 每 6 小时检查一次（减少 Vercel API 调用），到设定时间才发帖
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      post_topic:
        description: "帖子类型：tutorial / random（开源项目由 Auto category bots 负责）"
        required: false
        default: 'random'
      force:
        description: "强制执行（忽略时间检查）"
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: auto-forum-poster
  cancel-in-progress: true

jobs:
  check:
    name: Check schedule and post
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Check if it's time to run
        id: check
        run: |
          FORCE="${{ github.event.inputs.force || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL 未配置，跳过"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 读取后台配置
          CONFIG=$(curl -s "${SITE_URL}/api/schedule-config" 2>/dev/null || echo '{}')
          POSTER_ENABLED=$(echo "$CONFIG" | python3 -c "import sys,json; print(json.load(sys.stdin).get('posterEnabled', True))" 2>/dev/null || echo "True")
          HOUR1=$(echo "$CONFIG" | python3 -c "import sys,json; print(json.load(sys.stdin).get('posterHour1', 9))" 2>/dev/null || echo "9")
          HOUR2=$(echo "$CONFIG" | python3 -c "import sys,json; print(json.load(sys.stdin).get('posterHour2', 15))" 2>/dev/null || echo "15")

          if [ "$POSTER_ENABLED" = "False" ]; then
            echo "自动发帖已关闭"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 当前北京时间（UTC+8）
          CURRENT_HOUR=$(TZ='Asia/Shanghai' date +%H)
          echo "当前北京时间: ${CURRENT_HOUR}:00"
          echo "设定发帖时间: ${HOUR1}:00, ${HOUR2}:00"

          if [ "$CURRENT_HOUR" = "$HOUR1" ] || [ "$CURRENT_HOUR" = "$HOUR2" ]; then
            echo "时间匹配，开始发帖"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "未到发帖时间，跳过"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  post:
    name: Generate and publish post
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      # 多模型配置：优先使用 GitHub Secret 中的 AI_MODELS_CONFIG
      # 如果未配置 Secret，使用内置默认配置（GLM 主力 + Agnes 兜底）
      AI_MODELS_CONFIG: ${{ secrets.AI_MODELS_CONFIG }}
      POST_TOPIC: ${{ github.event.inputs.post_topic || 'random' }}
      AUTHOR_NAME: ${{ secrets.POSTER_AUTHOR_NAME || 'GitdBot' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate and publish post
        env:
          # 兜底：如果 AI_MODELS_CONFIG 未设置，使用内置默认模型配置
          # 与 lib/ai.ts 中的 DEFAULT_MODELS_CONFIG 保持一致
          AI_FALLBACK_MODELS_CONFIG: '[{"name":"GLM-5.2","apiKey":"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","apiBase":"https://integrate.api.nvidia.com/v1/chat/completions","model":"z-ai/glm-5.2"},{"name":"Agnes-2.5-flash","apiKey":"sk-cLl30kp5lGb1p8RUmrQRepLg3YcqUYBHbVk1qk4SrL3UKCNh","apiBase":"https://api.agnes-ai.cn/v1/chat/completions","model":"agnes-2.5-flash"}]'
        run: |
          if [ -z "$AI_MODELS_CONFIG" ]; then
            echo "AI_MODELS_CONFIG 未设置，使用内置默认模型配置"
            export AI_MODELS_CONFIG="$AI_FALLBACK_MODELS_CONFIG"
          else
            echo "使用 GitHub Secret 中的 AI_MODELS_CONFIG"
          fi

          node scripts/auto-forum-poster.mjs
