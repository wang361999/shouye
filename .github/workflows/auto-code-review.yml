name: Auto code review

# PR 打开时自动进行 AI 代码审查，并将审查结果作为评论发布到 PR。
# 排除 ai-iteration/ 开头的分支（AI 自动生成的 PR 不再审）。

on:
  pull_request:
    types:
      - opened
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: auto-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI code review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 跳过 AI 自动生成的 PR（ai-iteration/ 开头的分支）
    if: ${{ !startsWith(github.head_ref, 'ai-iteration/') }}

    env:
      # 多模型配置：优先使用 GitHub Secret 中的 AI_MODELS_CONFIG
      # 如果未配置 Secret，使用内置默认配置（GLM 主力 + Agnes 兜底）
      AI_MODELS_CONFIG: ${{ secrets.AI_MODELS_CONFIG }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run AI code review
        env:
          # 兜底：如果 AI_MODELS_CONFIG 未设置，使用内置默认模型配置
          # 与 lib/ai.ts 中的 DEFAULT_MODELS_CONFIG 保持一致
          AI_FALLBACK_MODELS_CONFIG: '[{"name":"GLM-5.2","apiKey":"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","apiBase":"https://integrate.api.nvidia.com/v1/chat/completions","model":"z-ai/glm-5.2"},{"name":"Agnes-2.5-flash","apiKey":"sk-cLl30kp5lGb1p8RUmrQRepLg3YcqUYBHbVk1qk4SrL3UKCNh","apiBase":"https://api.agnes-ai.cn/v1/chat/completions","model":"agnes-2.5-flash"}]'
        run: |
          if [ -z "$AI_MODELS_CONFIG" ]; then
            echo "AI_MODELS_CONFIG 未设置，使用内置默认模型配置"
            export AI_MODELS_CONFIG="$AI_FALLBACK_MODELS_CONFIG"
          else
            echo "使用 GitHub Secret 中的 AI_MODELS_CONFIG"
          fi

          node scripts/auto-code-review.mjs
