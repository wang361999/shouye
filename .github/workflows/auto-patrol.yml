name: Daily auto patrol

on:
  schedule:
    # 每天北京时间 10:00 自动执行（UTC 02:00）
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      requirement:
        description: "自定义巡检需求（留空则自动检查）"
        required: false
        default: ''

permissions:
  issues: write
  contents: read

concurrency:
  group: auto-patrol
  cancel-in-progress: false

jobs:
  patrol:
    name: Check and create issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy status and create issue
        run: |
          # 获取最近一次部署状态
          DEPLOY_STATE=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main/status" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('state','unknown'))" 2>/dev/null || echo "unknown")

          echo "部署状态：$DEPLOY_STATE"

          # 获取自定义需求或使用默认巡检需求
          CUSTOM_REQ="${{ github.event.inputs.requirement }}"
          if [ -n "$CUSTOM_REQ" ]; then
            REQUIREMENT="$CUSTOM_REQ"
          else
            # 根据部署状态生成不同的巡检需求
            if [ "$DEPLOY_STATE" = "failure" ]; then
              REQUIREMENT="最近部署失败，请检查项目构建错误并修复，确保 npm run lint 和 npm run build 能通过。"
            elif [ "$DEPLOY_STATE" = "pending" ]; then
              echo "部署正在进行中，跳过本次巡检"
              exit 0
            elif [ "$DEPLOY_STATE" = "success" ]; then
              REQUIREMENT="日常巡检：检查项目是否有明显代码问题、过期依赖、可以优化的性能点或 UI 细节。如果有则修复，没有则返回空改动。"
            else
              REQUIREMENT="日常巡检：检查项目部署状态和代码质量，修复发现的问题。"
            fi
          fi

          echo "巡检需求：$REQUIREMENT"

          # 检查今天是否已经有巡检 Issue
          TODAY=$(date -u +%Y-%m-%d)
          EXISTING=$(gh issue list \
            --state open \
            --search "AI 自动迭代请求：自动巡检 in:title created:>=${TODAY}" \
            --json number,title \
            --jq 'length' 2>/dev/null || echo "0")

          if [ "$EXISTING" != "0" ]; then
            echo "今天已经创建过巡检 Issue，跳过"
            exit 0
          fi

          # 创建巡检 Issue
          gh issue create \
            --title "AI 自动迭代请求：自动巡检 $(date -u +%Y-%m-%d)" \
            --body "## 自动巡检需求

          ${REQUIREMENT}

          ## 执行规则

          1. 免费订单、免费授权、普通用户权限和后台功能可以自动迭代。
          2. 禁止泄露或改写密钥、Token、密码。
          3. 禁止删除生产数据或破坏性数据库变更。
          4. 真实支付相关操作只能写说明。
          5. 不要修改 node_modules、.next、.env、prisma/migrations。

          ## 来源

          定时自动巡检触发（每天 10:00 北京时间）" \
            --label "ai-iteration"

          echo "巡检 Issue 已创建"
