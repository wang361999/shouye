name: Daily auto patrol

on:
  schedule:
    # 每 6 小时检查一次（减少 Vercel API 调用），到设定时间才执行
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      requirement:
        description: "自定义巡检需求（留空则按配置检查）"
        required: false
        default: ''
      force:
        description: "强制执行（忽略时间检查）"
        required: false
        default: 'false'

permissions:
  issues: write
  contents: read

concurrency:
  group: auto-patrol
  cancel-in-progress: false

jobs:
  check:
    name: Check schedule
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Check if it's time to run
        id: check
        run: |
          FORCE="${{ github.event.inputs.force || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL 未配置，使用默认时间 10:00"
            PATROL_ENABLED="True"
            PATROL_HOUR=10
          else
            CONFIG=$(curl -s "${SITE_URL}/api/schedule-config" 2>/dev/null || echo '{}')
            PATROL_ENABLED=$(echo "$CONFIG" | python3 -c "import sys,json; print(json.load(sys.stdin).get('patrolEnabled', True))" 2>/dev/null || echo "True")
            PATROL_HOUR=$(echo "$CONFIG" | python3 -c "import sys,json; print(json.load(sys.stdin).get('patrolHour', 10))" 2>/dev/null || echo "10")
          fi

          if [ "$PATROL_ENABLED" = "False" ]; then
            echo "自动巡检已关闭"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_HOUR=$(TZ='Asia/Shanghai' date +%H)
          echo "当前北京时间: ${CURRENT_HOUR}:00"
          echo "设定巡检时间: ${PATROL_HOUR}:00"

          if [ "$CURRENT_HOUR" = "$PATROL_HOUR" ]; then
            echo "时间匹配，开始巡检"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "未到巡检时间，跳过"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  patrol:
    name: Check and create issue
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deploy status and create issue
        run: |
          # 获取最近一次部署状态
          DEPLOY_STATE=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main/status" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('state','unknown'))" 2>/dev/null || echo "unknown")

          echo "部署状态：$DEPLOY_STATE"

          # 获取自定义需求或使用默认巡检需求
          CUSTOM_REQ="${{ github.event.inputs.requirement }}"
          if [ -n "$CUSTOM_REQ" ]; then
            REQUIREMENT="$CUSTOM_REQ"
          else
            if [ "$DEPLOY_STATE" = "failure" ]; then
              REQUIREMENT="最近部署失败，请检查项目构建错误并修复，确保 npm run lint 和 npm run build 能通过。"
            elif [ "$DEPLOY_STATE" = "pending" ]; then
              echo "部署正在进行中，跳过本次巡检"
              exit 0
            elif [ "$DEPLOY_STATE" = "success" ]; then
              IMPROVEMENTS=(
                "优化论坛页面的 UI 样式和交互体验，让帖子列表更美观"
                "优化后台管理看板，增加更多有用的数据展示"
                "改进首页布局，让工具展示更吸引人"
                "优化移动端适配，确保所有页面在手机上正常显示"
                "改进用户个人主页，增加更多实用信息展示"
                "优化论坛搜索功能，支持按标签和分类筛选"
                "改进帖子详情页，增加目录导航和阅读进度"
                "优化工具列表页，增加搜索和排序功能"
                "改进注册和登录页面的用户体验"
                "优化后台订单管理页面，增加批量操作功能"
              )
              RANDOM_INDEX=$((RANDOM % ${#IMPROVEMENTS[@]}))
              REQUIREMENT="日常优化：${IMPROVEMENTS[$RANDOM_INDEX]}。请仔细阅读相关代码并实施改进。"
            else
              REQUIREMENT="日常巡检：检查项目部署状态和代码质量，修复发现的问题。"
            fi
          fi

          echo "巡检需求：$REQUIREMENT"

          # 检查今天是否已经有巡检 Issue
          TODAY=$(date -u +%Y-%m-%d)
          EXISTING=$(gh issue list \
            --state open \
            --search "AI 自动迭代请求：自动巡检 in:title created:>=${TODAY}" \
            --json number,title \
            --jq 'length' 2>/dev/null || echo "0")

          if [ "$EXISTING" != "0" ]; then
            echo "今天已经创建过巡检 Issue，跳过"
            exit 0
          fi

          # 确保 ai-iteration 标签存在（不存在则创建）
          gh label create "ai-iteration" --color "0075ca" --description "AI 自动迭代请求" 2>/dev/null || true

          # 创建巡检 Issue
          gh issue create \
            --title "AI 自动迭代请求：自动巡检 $(date -u +%Y-%m-%d)" \
            --body "## 自动巡检需求

          ${REQUIREMENT}

          ## 执行规则

          1. 免费订单、免费授权、普通用户权限和后台功能可以自动迭代。
          2. 禁止泄露或改写密钥、Token、密码。
          3. 禁止删除生产数据或破坏性数据库变更。
          4. 真实支付相关操作只能写说明。
          5. 不要修改 node_modules、.next、.env、prisma/migrations。

          ## 来源

          定时自动巡检触发（按后台设定时间）" \
            --label "ai-iteration"

          echo "巡检 Issue 已创建"
