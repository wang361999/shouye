name: Auto tool generator

on:
  schedule:
    # 每 12 小时运行一次（北京时间 8:00 和 20:00）
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "强制执行"
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: auto-tool-generator
  cancel-in-progress: true

jobs:
  generate:
    name: Generate online tool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_BASE: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      AI_MODEL: gemini-3.6-flash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate and publish tool
        run: node scripts/auto-tool-generator.mjs
