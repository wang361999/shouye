name: Auto stale issue cleanup

on:
  schedule:
    # 每天凌晨 4:00 UTC（北京时间 12:00）执行
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: auto-stale-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Close stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark and close stale issues
        uses: actions/stale@v9
        with:
          # 30天无活动标记为 stale
          days-before-issue-stale: 30
          # 标记后再过7天无活动则关闭
          days-before-issue-close: 7
          # PR 60天无活动标记为 stale
          days-before-pr-stale: 60
          days-before-pr-close: 14

          stale-issue-label: 'stale'
          stale-pr-label: 'stale'

          stale-issue-message: |
            这个 Issue 已经 30 天没有活动了，标记为 stale。
            如果仍然需要处理，请添加评论或移除 stale 标签。
            7 天后仍无活动将自动关闭。

          stale-pr-message: |
            这个 PR 已经 60 天没有活动了，标记为 stale。
            如果仍在进行中，请更新进度或移除 stale 标签。
            14 天后仍无活动将自动关闭。

          close-issue-message: |
            此 Issue 因长时间无活动已自动关闭。
            如需重新打开，请添加评论说明。

          close-pr-message: |
            此 PR 因长时间无活动已自动关闭。
            如需继续，请重新提交 PR。

          # 排除带有这些标签的 Issue
          exempt-issue-labels: 'pinned,security,enhancement,ai-iteration,auto-link-checker'
          exempt-pr-labels: 'pinned,dependencies'

          # 只处理未指定 assignee 的 Issue
          exempt-all-assignees: true

          operations-per-run: 30
